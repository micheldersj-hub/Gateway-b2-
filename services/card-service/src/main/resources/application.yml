server:
  port: 8085

spring:
  application:
    name: card-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:card_db}
    username: ${DB_USER:gatewayb2}
    password: ${DB_PASSWORD:gatewayb2}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

gatewayb2:
  clients:
    account-service-base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
    ledger-service-base-url: ${LEDGER_SERVICE_URL:http://localhost:8083}
  card:
    # Chave AES-256 (base64) apenas para demonstração local. Em produção, injete via KMS/HSM/Vault
    # e nunca versione a chave real em repositório de código.
    encryption-key: ${CARD_ENCRYPTION_KEY:Zm6G4x6M19QuCKI080PtMDy3RVUYQIhKaId83Eu7lqQ=}
    default-daily-limit: ${CARD_DEFAULT_DAILY_LIMIT:5000.00}

resilience4j:
  circuitbreaker:
    instances:
      account-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
      ledger-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.gatewayb2: INFO
