name: gateway-b2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatewayb2
      POSTGRES_PASSWORD: gatewayb2
      POSTGRES_DB: gatewayb2
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewayb2"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 15

  kyc-service:
    build:
      context: .
      dockerfile: services/kyc-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kyc_db
      DB_USER: gatewayb2
      DB_PASSWORD: gatewayb2
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  account-service:
    build:
      context: .
      dockerfile: services/account-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: account_db
      DB_USER: gatewayb2
      DB_PASSWORD: gatewayb2
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  ledger-service:
    build:
      context: .
      dockerfile: services/ledger-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ledger_db
      DB_USER: gatewayb2
      DB_PASSWORD: gatewayb2
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: gatewayb2
      DB_PASSWORD: gatewayb2
      KAFKA_BROKERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started

  card-service:
    build:
      context: .
      dockerfile: services/card-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: card_db
      DB_USER: gatewayb2
      DB_PASSWORD: gatewayb2
      KAFKA_BROKERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gateway_db
      DB_USER: gatewayb2
      DB_PASSWORD: gatewayb2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KYC_SERVICE_URL: http://kyc-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      LEDGER_SERVICE_URL: http://ledger-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      CARD_SERVICE_URL: http://card-service:8085
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kyc-service:
        condition: service_started
      account-service:
        condition: service_started
      ledger-service:
        condition: service_started
      payment-service:
        condition: service_started
      card-service:
        condition: service_started

volumes:
  postgres-data:
